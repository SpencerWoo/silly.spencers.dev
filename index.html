<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A weekly collection of tiny websites by Spencer Woo.">
  <title>silly.spencers.dev</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>silly.<wbr>spencers.dev</h1>
    <p>One prompt, one tiny website, every week.</p>
    <a href="#archive">Browse past weeks ↓</a>
  </header>

  <main>
    <section class="prompt" aria-labelledby="prompt-heading">
      <h2 id="prompt-heading">This week’s prompt</h2>
      <p class="instruction">Make a website for something that doesn’t need one.</p>
      <p>The first site is in the works.</p>
    </section>

    <section class="archive" id="archive" aria-labelledby="archive-heading">
      <h2 id="archive-heading">Past weeks</h2>
      <!-- Replace the empty state with a list when the first week is archived.
           Give each entry a week date, its prompt, and a link to the creation.
           Keep the newest entry first. Creation links can be local or external. -->
      <p>Past prompts and their sites will collect here.</p>
    </section>
  </main>

  <footer>Made by <a href="https://spencers.dev/">Spencer Woo</a>.</footer>
</body>
</html>
