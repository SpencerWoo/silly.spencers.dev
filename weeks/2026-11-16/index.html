<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A website for a doorstop. Try to close the door.">
  <title>The Doorstop · silly.spencers.dev</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <div>created as part of <a class="back" href="https://silly.spencers.dev">https://silly.spencers.dev</a> project for week <time datetime="2026-11-16">november 16</time>–<time datetime="2026-11-22">22, 2026</time></div>

    <div class="exhibit">
      <header>
        <h1>The<br>Doorstop</h1>
        <p>A website for a small rubber wedge.</p>
      </header>

      <label class="control">
        <input type="checkbox">
        Try to close the door
      </label>

      <p class="result">
        <span class="ready">The door is open.</span>
        <span class="stopped">Still open. The doorstop has done its job.</span>
      </p>

      <div class="scene" aria-hidden="true">
        <div class="floor"></div>
        <div class="frame">
          <div class="door"><span></span></div>
        </div>
        <div class="wedge"></div>
      </div>
    </div>
  </main>
</body>
</html>
